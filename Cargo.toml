[package]
name = "quire-corpus"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
description = "Deterministic bounds, digest, and scoring tools for quire-corpus"
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-corpus"
default-run = "quire-corpus"

[lib]
name = "quire_corpus"
path = "src/lib.rs"

[[bin]]
name = "quire-corpus"
path = "src/main.rs"

[[bin]]
name = "quire-corpus-test-producer"
path = "src/bin/test-producer.rs"
doc = false

[dependencies]
blake2 = "=0.10.6"
clap = { version = "=4.6.0", features = ["derive"] }
regex = "=1.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
serde_yaml = { package = "yaml_serde", version = "=0.10.7" }
thiserror = "=2.0.18"
walkdir = "=2.5.0"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
