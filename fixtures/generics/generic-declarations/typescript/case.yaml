id: generic-declarations
family: generics
language: typescript
kind: positive
issue_ref: agent-ix/quire-corpus#1
control_for_pair: generic-receiver-unknowable
control_language: rust
criteria:
- FR-001-AC-1
- FR-001-AC-2
- FR-001-AC-3
comment: >-
  A generic type, its bounded parameter, and a concrete type satisfying the
  bound. The type parameter is not a declaration and must not become a node;
  the generic type and its method are declarations and must. A producer that
  reads the parameter list as a declaration list mints a node for `T` in
  every generic file in a repository - and one that gives up on a generic
  declaration entirely loses the type it was written for.
