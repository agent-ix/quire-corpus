id: trait-implementation
family: types
language: rust
kind: positive
issue_ref: agent-ix/quire-corpus#1
control_for_pair: inherent-implementation
comment: >-
  An `impl Trait for Type` block. The trait relation is an edge, never a
  name segment, because the method is named by its implementing type - so a
  producer that folds the trait into the name loses the ability to ask who
  implements what.
