id: chain-beyond-the-bound
family: scale
language: rust
kind: control
issue_ref: agent-ix/quire-corpus#1
control_for: binding-from-bound-name
control_language: rust
criteria:
- FR-008-CON-2
comment: >-
  A binding propagated through 13 assignments, past the ten-iteration bound
  the fixpoint carries. FR-008-CON-2 says reaching the bound degrades to
  fewer edges rather than to unbounded work, so the run must finish and must
  not answer with a guess: a second type declaring the same method is
  present so that the wrong answer is available. Whether the chain resolves
  is the producer's business; that it terminates without inventing an edge
  is the corpus's.
