family: links
language: mixed
kind: positive
issue_ref: agent-ix/quire-corpus#1
no_control_reason: "The two declarations are each other's control - same text, same file, different kind - which is stronger than a second tree because nothing else varies."
criteria:
- FR-005-AC-1
