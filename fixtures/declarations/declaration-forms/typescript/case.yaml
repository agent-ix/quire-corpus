comment: >-
  The TypeScript counterpart. `interface` and `type` are separate kinds and a
  producer that reports both as `type` loses the distinction a public-surface
  diff depends on. The arrow-function const is here because it is the form
  most often missed: it is a variable declaration whose initializer is the
  callable.
