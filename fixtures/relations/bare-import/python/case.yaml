id: bare-import
family: relations
language: python
kind: control
control_for: receiver-typed-call
issue_ref: agent-ix/quire-rs#385
criteria:
- FR-003-AC-3
comment: >-
  A specifier that names no file in the batch. The correct output is no
  import edge and no diagnostic: an unresolvable *bare* specifier is not
  an error, it is a package the batch does not contain. A producer that
  diagnoses it will drown a real repository in noise, and one that emits
  an edge has invented a node.
