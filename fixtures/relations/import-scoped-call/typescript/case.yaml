comment: >-
  The middle resolution tier, and the one nothing measured until now. Two
  types in the batch declare `upsert` and the receiver's type does not
  resolve, so the batch alone is ambiguous — but the calling file imports
  exactly one of them. FR-008 says that narrows to `import-scoped`, and
  the control next door is the same tree with the import widened, where
  the correct output is nothing.
