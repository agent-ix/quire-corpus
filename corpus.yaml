# The shared complete-graph corpus. Contract: spec/functional/FR-001..FR-004.
#
# THIS FILE DECLARES INTENT. It does not record state.
#
# What a human writes here: the vocabularies, the producer contract, and the
# INVENTORY — for each case, the languages it must exist in, and any cell
# deliberately scoped out with its reason.
#
# What is DERIVED from the filesystem, every time, by `quire-corpus bounds`:
#   covered  — a fixture exists for that case and language
#   GAP      — declared applicable, no fixture, not scoped out
#   gap_count and the sum invariant
#
# `gap_count` is a COUNT, never a ratio (FR-002-CON-1). A ratio falls as easy
# cases are added, so a corpus could improve its number while the hard
# missing case stayed missing.
#
# Why this corpus is separate from agent-ix/qa-corpus: that one grades
# *detection and minting* over authored markdown, one defect per case. This
# one grades a **complete linked graph** — declarations, relations, surfaces,
# cross-layer links, and the traversal answers derived from them. A case here
# is a small repository, not a snippet, because the failures being measured
# only exist between files.

schema_version: 1
contract: spec/functional/FR-001-corpus-structure.md

languages: [rust, typescript, python, mixed]

families:
- ambiguity
- declarations
- determinism
- identity
- impact
- imports
- links
- paths
- relations
- resilience
- surfaces
- test-selection
- types

# Declared now, populated behind their own tickets. Reserving the name and
# the schema slot is what keeps a later producer from inventing a parallel
# format for the same thing (agent-ix/filament-ide-rs#541, #534).
reserved_families:
  resources:
    issue_ref: agent-ix/filament-ide-rs#541
    reason: >-
      HTTP routes, SQL objects, messaging topics, FFI boundaries and
      configuration references. Each family is measured and reviewed
      independently before it propagates impact, so each arrives as its own
      versioned fixture family rather than as rows bolted onto `relations`.
  requirement-recovery:
    issue_ref: agent-ix/filament-ide-rs#534
    reason: >-
      Evidence-grounded requirement candidates and unknowns. Needs a
      disposition model before a fixture can state expected truth, because
      the truth is a reviewer's judgement and not a graph fact.

# How a producer is invoked. A producer reads one fixture's `input/` tree and
# writes the canonical record JSON on stdout; nothing else is read, and no
# network is available. The corpus grades the output, never the producer.
producer_contract:
  version: 2
  invocation:
    executable: "<producer>"
    arguments: ["--org", "{org}", "--repo", "{repo}", "{input}"]
  stdout: canonical-records-v1
  documented: spec/functional/FR-003-producer-contract.md

# Whose criteria this corpus is measured against. `spec_root` is read to
# enumerate every acceptance criterion and constraint the tool declares, so
# "which of them does the data reach?" is derived from two trees rather than
# claimed in a README.
#
# `unreachable` records the criteria a corpus of this shape structurally cannot
# reach, each with the reason. It is not an exemption list: a criterion that is
# merely unwritten belongs in neither set and fails the gate.
producers:
  quire-code-rs:
    criteria_pin: producers/quire-code-rs.criteria.yaml
    unreachable:
      crate-property: >-
        A property of the tool's own source or dependency tree rather than of
        its output. A corpus reads stdout; it cannot see a lint attribute, a
        dependency closure, or a static audit of extraction paths.
        FR-001-AC-7, FR-001-CON-1, FR-001-CON-2, FR-003-CON-1, FR-004-CON-1,
        FR-005-CON-1, FR-009-CON-1, FR-009-CON-2, NFR-001-AC-4, NFR-001-AC-5,
        NFR-002-AC-1, NFR-002-AC-2, NFR-002-AC-3
      repo-local-evidence: >-
        Evidence that exists only inside the tool's own repository - its golden
        file, its own test suite, a serialized record from a previous release.
        FR-005-AC-7, FR-006-AC-6, FR-009-AC-9
      benchmark-lane: >-
        A wall-clock or corpus-scale number the tool's own benchmark lane owns.
        Measuring it here would make a correctness gate fail for reasons of host
        speed. NFR-003-AC-1, NFR-003-AC-2, NFR-003-AC-3, NFR-003-AC-4,
        NFR-003-AC-5, NFR-004-AC-5
      repetition-scale: >-
        A hundred repeated extractions and eight concurrent threads. The corpus
        runs a producer twice, which catches an unstable ordering and not a rare
        race. NFR-001-AC-1, NFR-001-AC-2
      producer-binary: >-
        The contract of the binary this corpus invokes, tested in the repository
        that ships it - a corpus cannot be the thing that verifies the shape it
        depends on to run at all. FR-010-AC-1, FR-010-AC-2, FR-010-AC-3,
        FR-010-AC-4, FR-010-AC-5, FR-010-CON-1, FR-010-CON-2
      stakeholder-validation: >-
        A stakeholder validation criterion, discharged against what a consumer
        of the tool observes rather than against the records the tool writes.
        StR-001-VC-1, StR-001-VC-2, StR-001-VC-3, StR-001-VC-4, StR-002-VC-1,
        StR-002-VC-2, StR-002-VC-3, StR-002-VC-4
      host-dependent-input: >-
        A criterion whose input cannot exist as a committed fixture. A path with
        a backslash segment is not creatable on a POSIX filesystem, so a
        Windows-style path can only be supplied through the library API.
        FR-002-AC-6

# For each case: the languages that must have a fixture. A case appearing in
# one language and not another is a GAP unless it is scoped out with a
# reason, and "not implemented yet" is a GAP, not an exclusion.
inventory:
  ambiguity:
    same-name-two-files: [mixed]
  declarations:
    declaration-forms: [rust, typescript, python]
    remaining-forms: [rust, typescript, python]
  determinism:
    repeated-extraction: [mixed]
  fixpoint:
    binding-from-bound-name: [rust, typescript, python]
    binding-from-return-type: [rust, typescript, python]
    cyclic-bindings-terminate: [rust, typescript, python]
    local-rebinding-isolated: [rust, typescript, python]
    tier-rank-order: [rust]
  generics:
    generic-declarations: [rust, typescript, python]
    generic-receiver-unknowable: [rust]
  generated:
    expansion-invisible: [rust, typescript, python]
  identity:
    inherent-and-trait-impl-collision: [rust]
    nested-path-identity: [mixed]
  impact:
    impact-closure: [mixed]
  imports:
    broken-relative-specifier: [rust, typescript, python]
    extensionless-specifier: [rust, typescript, python]
    index-stem-specifier: [rust, typescript, python]
    re-export-barrel: [rust, typescript, python]
    re-export-same-name: [rust, typescript, python]
  invariants:
    declaration-moved: [rust]
    parameter-type-changed: [rust]
    private-helper-added: [rust]
    two-orgs: [rust]
    unrelated-file-added: [rust]
  links:
    ix-reference: [mixed]
    spec-code-test-links: [mixed]
    string-literal-lookalike: [mixed]
    tag-outside-test: [mixed]
  provenance:
    evidence-cap: [rust]
    folded-call-sites: [rust, typescript, python]
    strongest-reason-wins: [rust]
  paths:
    call-chain-path: [mixed]
  relations:
    bare-import: [rust, typescript, python]
    import-scoped-ambiguous: [rust, typescript, python]
    import-scoped-call: [rust, typescript, python]
    name-match-ambiguous: [rust, typescript, python]
    name-match-call: [rust, typescript, python]
    receiver-typed-call: [rust, typescript, python]
    receiver-typed-call-ambiguous: [rust, typescript, python]
    recursive-call: [rust, typescript, python]
    same-file-preference: [mixed]
  resilience:
    arbitrary-bytes: [rust, typescript, python]
    body-error-tolerated: [rust, typescript, python]
    empty-file: [rust, typescript, python]
    invalid-file-in-batch: [rust, typescript, python]
  scale:
    chain-beyond-the-bound: [rust]
    many-same-name-declarers: [rust]
  surfaces:
    export-surface: [rust, typescript, python]
    private-lookalike:
      languages: [rust]
      out_of_scope:
        typescript: >-
          The TypeScript positive already carries its own lookalike inside one
          file - `NotExported` is the unexported class beside the exported one -
          so a separate tree would duplicate the control rather than add one.
        python: >-
          Same: the Python positive's `_crate_visible` and `__private_helper`
          are the lookalike, in the same file as the public members they must
          not be confused with.
    rust-visibility-forms: [rust]
    signature-fidelity: [rust, typescript, python]
  test-selection:
    affected-tests: [mixed]
  types:
    implements-and-extends: [typescript]
    inherent-implementation: [rust]
    multiple-inheritance: [python]
    trait-implementation: [rust]
    trait-object-call: [rust]
